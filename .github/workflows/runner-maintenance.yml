---
name: runner maintenance

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: runner-maintenance-prometheus
  cancel-in-progress: false

jobs:
  install-windows-exporter:
    name: Install Windows Exporter on prometheus
    runs-on:
    - self-hosted
    - windows-x86_64-prometheus
    timeout-minutes: 10
    steps:
    - name: Verify administrative access
      shell: powershell
      run: |
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = [Security.Principal.WindowsPrincipal]::new($identity)
        $administrator = [Security.Principal.WindowsBuiltInRole]::Administrator

        if (-not $principal.IsInRole($administrator)) {
          throw "The runner service account is not an administrator."
        }

        Write-Host "Runner identity: $($identity.Name)"

    - name: Download, verify, and install Windows Exporter
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $version = "0.31.8"
        $expectedHash = "0aadce6afb20182b678bfca9e8f2e8464ef48c469b28b4cf02e99d82158f5d40"
        $installer = Join-Path $env:RUNNER_TEMP "windows_exporter-$version-amd64.msi"
        $uri = "https://github.com/prometheus-community/windows_exporter/releases/download/v$version/windows_exporter-$version-amd64.msi"

        Invoke-WebRequest -Uri $uri -OutFile $installer

        $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "Windows Exporter checksum mismatch: expected $expectedHash, got $actualHash"
        }

        $arguments = @(
          "/i"
          "`"$installer`""
          "/qn"
          "/norestart"
          "ENABLED_COLLECTORS=[defaults],process"
          "LISTEN_ADDR=100.66.255.34"
          "ADDLOCAL=FirewallException"
          "REMOTE_ADDR=100.64.0.0/10"
        )

        $installerProcess = Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList $arguments `
          -Wait `
          -PassThru

        if ($installerProcess.ExitCode -notin 0, 3010) {
          throw "Windows Exporter installer exited with code $($installerProcess.ExitCode)"
        }

    - name: Verify exporter and runner services
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Get-Service windows_exporter |
          Format-List Name, Status, StartType

        Invoke-WebRequest `
          -Uri "http://100.66.255.34:9182/health" `
          -UseBasicParsing |
          Select-Object StatusCode

        Get-CimInstance Win32_Service |
          Where-Object Name -Like "actions.runner.*" |
          Select-Object Name, State, StartMode, StartName |
          Format-List
